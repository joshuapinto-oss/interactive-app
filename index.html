<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>For you</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: 'Pacifico', cursive;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #111;
    transform: scaleX(-1); will-change: transform; }
  video.back { transform: none; }
  #tint { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(255,120,160,0) 42%, rgba(120,20,60,.3) 100%); }
  #start {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 18px; z-index: 5;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
    background: radial-gradient(circle at 30% 20%, #ffe9a8, transparent 55%), linear-gradient(160deg, #ffc2d4, #ffe3b8);
    color: #c2185b; transition: opacity .55s ease; overflow: hidden;
  }
  #start.hide { opacity: 0; pointer-events: none; }
  #start h1 { font-size: clamp(38px, 11vw, 68px); margin: 0; font-weight: 400; text-shadow: 0 2px 0 rgba(255,255,255,.6); }
  #start p { font-family: system-ui, sans-serif; color: #7a4a5a; margin: 0; max-width: 330px; line-height: 1.55; }
  #start .tip { font-size: 13px; opacity: .75; }
  button.main { font-family: 'Pacifico', cursive; font-size: 24px; padding: 14px 40px; border: 0;
    border-radius: 999px; background: linear-gradient(135deg, #ff5c8a, #e91e63); color: #fff;
    box-shadow: 0 8px 22px rgba(233,30,99,.45); }
  button.main { animation: pulse 2.4s ease-in-out infinite; }
  button.main:active { animation: none; transform: scale(.97); }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
  .fl { position: absolute; font-size: 30px; opacity: .85; pointer-events: none; animation: drift 5s ease-in-out infinite; }
  @keyframes drift { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-16px) rotate(8deg); } }
  #status { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 92px); left: 50%; transform: translateX(-50%);
    color: #fff; font-family: system-ui, sans-serif; font-size: 12.5px; padding: 6px 14px; border-radius: 999px;
    background: rgba(20,20,30,.5); white-space: nowrap; pointer-events: none; letter-spacing: .1px;
    opacity: 0; transition: opacity .4s ease; }
  #status.on { opacity: 1; }
  .btn { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 22px); width: 54px; height: 54px; border-radius: 50%;
    border: 0; background: rgba(255,255,255,.22); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-size: 24px; color: #fff; display: flex; align-items: center; justify-content: center; z-index: 3;
    opacity: 0; pointer-events: none; transform: scale(.85); transition: opacity .45s ease, transform .25s ease; }
  .btn.show { opacity: 1; pointer-events: auto; transform: scale(1); }
  .btn.show:active { transform: scale(.92); }
  #flip { left: 22px; } #shot { right: 22px; } #replay { left: 50%; margin-left: -27px; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 4; }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<div id="tint"></div>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="status"></div>
<button class="btn" id="flip" aria-label="Flip camera">🔄</button>
<button class="btn" id="replay" aria-label="Show message">💌</button>
<button class="btn" id="shot" aria-label="Save photo">📸</button>
<div id="start">
  <span class="fl" style="left:10%;top:14%">🌸</span><span class="fl" style="right:12%;top:20%;animation-delay:-1.2s">🦋</span><span class="fl" style="left:16%;bottom:16%;animation-delay:-2.4s">🌼</span><span class="fl" style="right:14%;bottom:12%;animation-delay:-3.4s">🌺</span>
  <h1 id="startTitle"></h1>
  <p>Allow the camera. <b>Point</b> your finger to plant flowers around your head, <b>open your hand</b> to scatter them, and make a <b>heart</b> with your hands for a surprise.</p>
  <button class="main" id="go">Start</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/face_detection.js" crossorigin="anonymous"></script>
<script>
// =============== EDIT THESE ===============
const CONFIG = {
  title: "For Richa",
  subtitle: "this one is just for you",
  startTitle: "Hey Richa",
  // Message shown when she makes a heart. One entry per line.
  heartMessage: [
    "i love you riuuu soo muchh,",
    "life is better with you in it,",
    "my pyara bachuu,",
    "may all your dreams come true baby,",
    "Jesus is with u always my shona,",
    "God bless you my love with loads of happiness,",
    "success and may you prosper in everything you do,",
    "i am always here for you my babuli!!!"],
  messageSeconds: 17,
  holdMs: 450,             // how long she has to hold the heart (milliseconds)
  forgiveness: 1.0,        // 1.3 = heart easier to trigger, 0.8 = stricter
  maxHands: 4,             // 2 = one person. Set 4 if two people use it together (more false hands possible)
  followHead: false,       // false = flowers planted near the head stay where they are (don't follow her head)
  fingerHeart: false,      // false = heart needs BOTH hands (one-hand finger heart off)
  scatterHoldMs: 180,      // how long an open hand must be held to blow the flowers away
  handModel: 1,            // 1 = accurate (default; drops to 0 by itself if the device is too slow), 0 = fastest
  maxPlanted: 700,         // how many flowers can stay planted at once
  maxParticles: 400,
};
// ==========================================
// Tip: add ?debug to the web address to see live numbers.

const DEBUG = /debug/.test(location.search);
const DEFAULT_HINT = 'Point to plant · Open your hand to scatter';
document.getElementById('startTitle').textContent = CONFIG.startTitle;
const video = document.getElementById('video');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const say = t => { if (statusEl.textContent !== t) statusEl.textContent = t; statusEl.classList.add('on'); };
let W = 0, H = 0, DPR = 1, vw = 640, vh = 480, mirrored = true, facing = 'user', vignette = null;

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 1.5);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingQuality = 'high';
  buildVignette();
}
// the soft warm edge is drawn once and reused (used for photos)
function buildVignette() {
  const c = document.createElement('canvas'); c.width = Math.ceil(W); c.height = Math.ceil(H);
  const g = c.getContext('2d'), gr = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  gr.addColorStop(0, 'rgba(255,120,160,0)'); gr.addColorStop(1, 'rgba(120,20,60,.3)'); g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height);
  vignette = c;
}
addEventListener('resize', resize); resize();

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const coverScale = () => Math.max(W / vw, H / vh);

function toScreen(p) {
  const s = coverScale(), dw = vw * s, dh = vh * s;
  const x = (W - dw) / 2 + p.x * dw;
  return { x: mirrored ? W - x : x, y: (H - dh) / 2 + p.y * dh };
}

// =============== The heart shape ===============
function heartPt(t) {
  const a = t * Math.PI * 2;
  const x = 16 * Math.pow(Math.sin(a), 3);
  const y = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a));
  return { x: x / 32, y: (y - 2.5) / 32 };
}
const HEART = new Path2D();
for (let i = 0; i <= 120; i++) { const p = heartPt(i / 120); if (i) HEART.lineTo(p.x, p.y); else HEART.moveTo(p.x, p.y); }
HEART.closePath();

// ===== Realistic procedural flower sprites =====
// Each flower is painted once into its own small canvas (petal gradients, veins, soft shadow, textured centres),
// then reused everywhere. Deterministic: the same seed always gives the same flower.
const FS = 144;                                   // sprite size in pixels
function rngOf(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hsl = (h, s, l, a = 1) => `hsla(${((h % 360) + 360) % 360},${s}%,${l}%,${a})`;

// ---- petal outlines (pointing up, base at origin) ----
function pPoint(g, L, w) { g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo(w, -L * 0.16, w * 0.86, -L * 0.8, 0, -L); g.bezierCurveTo(-w * 0.86, -L * 0.8, -w, -L * 0.16, 0, 0); g.closePath(); }
function pRound(g, L, w) { g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo(w * 1.35, -L * 0.04, w * 1.2, -L * 1.06, 0, -L); g.bezierCurveTo(-w * 1.2, -L * 1.06, -w * 1.35, -L * 0.04, 0, 0); g.closePath(); }
function pNotch(g, L, w) { g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo(w * 1.5, -L * 0.1, w * 1.35, -L * 1.0, w * 0.2, -L); g.lineTo(0, -L * 0.87); g.lineTo(-w * 0.2, -L); g.bezierCurveTo(-w * 1.35, -L * 1.0, -w * 1.5, -L * 0.1, 0, 0); g.closePath(); }
function pFringe(g, L, w) { g.beginPath(); g.moveTo(0, 0); g.lineTo(w * 0.8, -L * 0.62); g.lineTo(w * 1.1, -L * 0.98); g.lineTo(w * 0.4, -L * 0.82); g.lineTo(0, -L); g.lineTo(-w * 0.4, -L * 0.82); g.lineTo(-w * 1.1, -L * 0.98); g.lineTo(-w * 0.8, -L * 0.62); g.closePath(); }
function pTwist(g, L, w) { g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo(w * 1.7, -L * 0.08, w * 1.5, -L * 0.95, w * 0.25, -L); g.bezierCurveTo(-w * 0.6, -L * 0.72, -w * 0.5, -L * 0.2, 0, 0); g.closePath(); }

// paint one petal: gradient base->tip, centre vein, soft edge line
function petal(g, shape, L, w, base, mid, tip, o = {}) {
  shape(g, L, w);
  const gr = g.createLinearGradient(0, 0, 0, -L);
  gr.addColorStop(0, base); gr.addColorStop(o.midAt || 0.5, mid); gr.addColorStop(1, tip);
  g.fillStyle = gr; g.fill();
  g.save(); g.clip();
  const sh = g.createLinearGradient(-w, 0, w, 0);            // slight left-light / right-dark fold
  sh.addColorStop(0, 'rgba(255,255,255,.14)'); sh.addColorStop(0.5, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(0,0,0,.13)');
  g.fillStyle = sh; g.fillRect(-w * 2, -L * 1.1, w * 4, L * 1.2);
  if (o.vein !== false) {
    g.strokeStyle = o.veinCol || 'rgba(0,0,0,.14)'; g.lineWidth = Math.max(0.6, L * 0.022);
    g.beginPath(); g.moveTo(0, -L * 0.05); g.lineTo(0, -L * 0.82); g.stroke();
    if (o.veins) { g.lineWidth = Math.max(0.5, L * 0.012); for (const k of [-1, 1]) for (const t of [0.3, 0.5, 0.68]) { g.beginPath(); g.moveTo(0, -L * t); g.lineTo(k * w * 0.62, -L * (t + 0.14)); g.stroke(); } }
  }
  g.restore();
  shape(g, L, w); g.strokeStyle = o.edge || 'rgba(0,0,0,.2)'; g.lineWidth = Math.max(0.7, L * 0.018); g.stroke();
}
function ring(g, n, off, fn) { for (let i = 0; i < n; i++) { g.save(); g.rotate(off + i * TAU / n); fn(i); g.restore(); } }
function dots(g, rng, cx, cy, rad, n, col, size, kind) {         // seed/pollen texture (golden-angle spiral)
  for (let k = 1; k < n; k++) { const r = rad * Math.sqrt(k / n), a = k * 2.39996323; g.fillStyle = typeof col === 'function' ? col(k, r) : col; g.beginPath(); g.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, size * (0.8 + rng() * 0.5), 0, TAU); g.fill(); }
}
function disc(g, r, c0, c1, edge) { const gr = g.createRadialGradient(-r * 0.25, -r * 0.3, r * 0.1, 0, 0, r); gr.addColorStop(0, c0); gr.addColorStop(1, c1); g.fillStyle = gr; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill(); if (edge) { g.strokeStyle = edge; g.lineWidth = r * 0.1; g.stroke(); } }

// ---- species ----
const SPECIES = {
  sunflower(g, R, rng, p) {
    ring(g, 22, rng(), i => petal(g, pPoint, R * (0.98 - rng() * 0.05), R * 0.125, p.a, p.b, p.c, { veins: false }));
    ring(g, 20, 0.15, i => petal(g, pPoint, R * (0.86 - rng() * 0.05), R * 0.12, p.a, p.b, p.c, { veins: false }));
    disc(g, R * 0.37, '#7a4416', '#2a1305', 'rgba(255,200,80,.55)');
    dots(g, rng, 0, 0, R * 0.34, 110, (k, r) => k % 3 ? 'rgba(255,205,110,.34)' : 'rgba(10,4,0,.5)', R * 0.017);
  },
  daisy(g, R, rng, p) {
    ring(g, 18, rng(), i => petal(g, pPoint, R * (0.98 - rng() * 0.06), R * 0.09, p.a, p.b, p.c));
    ring(g, 17, 0.2, i => petal(g, pPoint, R * (0.86 - rng() * 0.05), R * 0.085, p.a, p.b, p.c));
    disc(g, R * 0.25, '#ffd21f', '#d98a00', 'rgba(150,80,0,.35)');
    dots(g, rng, 0, 0, R * 0.22, 60, 'rgba(120,60,0,.4)', R * 0.016);
  },
  gerbera(g, R, rng, p) {
    ring(g, 28, rng(), i => petal(g, pPoint, R * (0.99 - rng() * 0.05), R * 0.082, p.a, p.b, p.c));
    ring(g, 22, 0.1, i => petal(g, pPoint, R * (0.8 - rng() * 0.04), R * 0.08, p.a, p.b, p.c));
    ring(g, 15, 0.3, i => petal(g, pPoint, R * (0.6 - rng() * 0.03), R * 0.08, p.b, p.b, p.c));
    disc(g, R * 0.2, p.d || '#40200a', '#1a0a02', 'rgba(255,215,90,.8)');
    dots(g, rng, 0, 0, R * 0.17, 40, 'rgba(255,225,120,.5)', R * 0.014);
  },
  cornflower(g, R, rng, p) {
    ring(g, 15, rng(), i => petal(g, pFringe, R * (0.98 - rng() * 0.05), R * 0.11, p.a, p.b, p.c, { vein: false }));
    ring(g, 12, 0.25, i => petal(g, pFringe, R * (0.74 - rng() * 0.04), R * 0.1, p.a, p.b, p.c, { vein: false }));
    ring(g, 9, 0.5, i => petal(g, pFringe, R * 0.5, R * 0.085, p.b, p.c, p.c, { vein: false }));
    disc(g, R * 0.12, '#3a1a6a', '#1d0a40');
    dots(g, rng, 0, 0, R * 0.1, 18, 'rgba(230,200,255,.55)', R * 0.012);
  },
  aster(g, R, rng, p) {
    ring(g, 36, rng(), i => petal(g, pPoint, R * (0.99 - rng() * 0.06), R * 0.05, p.a, p.b, p.c, { vein: false }));
    ring(g, 30, 0.1, i => petal(g, pPoint, R * (0.82 - rng() * 0.05), R * 0.05, p.a, p.b, p.c, { vein: false }));
    disc(g, R * 0.19, '#ffd21f', '#e08a00', 'rgba(130,60,0,.4)');
    dots(g, rng, 0, 0, R * 0.17, 40, 'rgba(120,50,0,.4)', R * 0.013);
  },
  rose(g, R, rng, p) {
    const rings = [[7, 1.0, 0.36], [6, 0.8, 0.34], [5, 0.62, 0.32], [4, 0.46, 0.3], [3, 0.31, 0.28]];
    rings.forEach(([n, s, w], r) => ring(g, n, rng() * TAU, i => petal(g, pRound, R * s, R * w * s * 1.2, r === 0 ? p.a : p.b, p.b, p.c, { vein: false, edge: 'rgba(60,0,20,.34)' })));
    g.strokeStyle = 'rgba(70,0,25,.45)'; g.lineWidth = R * 0.028; g.beginPath();
    for (let t = 0; t < 9; t += 0.2) { const rr = R * 0.04 * t, a = t * 1.1; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.stroke();
  },
  ranunculus(g, R, rng, p) {
    for (let r = 0; r < 8; r++) { const s = 1 - r * 0.115; ring(g, 9 - Math.floor(r / 2), rng() * TAU, i => petal(g, pRound, R * s, R * 0.19 * s * 1.5, p.a, p.b, r > 5 ? p.a : p.c, { vein: false, edge: 'rgba(80,20,0,.32)' })); }
    g.strokeStyle = 'rgba(90,20,0,.4)'; g.lineWidth = R * 0.03; g.beginPath(); for (let t = 0; t < 8; t += 0.2) { const rr = R * 0.035 * t, a = t * 1.3; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.stroke();
  },
  lily(g, R, rng, p) {
    ring(g, 3, 0.52, i => petal(g, pPoint, R * 0.96, R * 0.2, p.a, p.b, p.c, { veins: true, veinCol: p.v }));
    ring(g, 3, 0, i => petal(g, pPoint, R * 1.0, R * 0.26, p.a, p.b, p.c, { veins: true, veinCol: p.v }));
    ring(g, 3, 0, i => { g.fillStyle = p.s || 'rgba(120,10,70,.55)'; for (let k = 0; k < 9; k++) { g.beginPath(); g.arc((rng() - 0.5) * R * 0.16, -R * (0.18 + rng() * 0.38), R * (0.014 + rng() * 0.014), 0, TAU); g.fill(); } });
    g.lineCap = 'round'; ring(g, 6, 0.2, i => { g.strokeStyle = 'rgba(240,240,200,.95)'; g.lineWidth = R * 0.022; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -R * 0.5); g.stroke(); g.fillStyle = '#c0561a'; g.beginPath(); g.ellipse(0, -R * 0.52, R * 0.028, R * 0.07, 0, 0, TAU); g.fill(); });
    disc(g, R * 0.06, '#9bd36a', '#4f8a2a');
  },
  pansy(g, R, rng, p) {
    const pet = (ang, L, w, a, b, c) => { g.save(); g.rotate(ang); petal(g, pRound, L, w, a, b, c, { vein: false, edge: 'rgba(30,0,50,.35)' }); g.restore(); };
    pet(-0.55, R * 0.86, R * 0.3, p.a, p.b, p.c); pet(0.55, R * 0.86, R * 0.3, p.a, p.b, p.c);
    pet(-1.45, R * 0.78, R * 0.3, p.b, p.b, p.c); pet(1.45, R * 0.78, R * 0.3, p.b, p.b, p.c);
    pet(Math.PI, R * 0.92, R * 0.34, p.a, p.b, p.d || p.c);
    g.save(); g.globalCompositeOperation = 'source-atop';
    ring(g, 5, -0.55, i => { const gr = g.createRadialGradient(0, -R * 0.15, 1, 0, -R * 0.15, R * 0.34); gr.addColorStop(0, 'rgba(25,0,45,.85)'); gr.addColorStop(1, 'rgba(25,0,45,0)'); g.fillStyle = gr; g.fillRect(-R * 0.4, -R * 0.55, R * 0.8, R * 0.7); });
    g.restore();
    g.strokeStyle = 'rgba(25,0,45,.6)'; g.lineWidth = R * 0.016; ring(g, 11, 0.1, i => { g.beginPath(); g.moveTo(0, -R * 0.1); g.lineTo(0, -R * 0.36); g.stroke(); });
    disc(g, R * 0.09, '#ffe35a', '#e0a000');
  },
  blossom(g, R, rng, p) {
    ring(g, 5, rng(), i => petal(g, pNotch, R * 0.98, R * 0.27, p.a, p.b, p.c, { vein: false, edge: 'rgba(120,20,60,.28)' }));
    g.strokeStyle = 'rgba(160,20,70,.45)'; g.lineWidth = R * 0.02; ring(g, 5, 0, i => { g.beginPath(); g.moveTo(0, -R * 0.04); g.lineTo(0, -R * 0.38); g.stroke(); });
    g.lineCap = 'round'; ring(g, 12, 0.1, i => { const L = R * (0.3 + rng() * 0.15); g.strokeStyle = 'rgba(255,235,240,.9)'; g.lineWidth = R * 0.016; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -L); g.stroke(); g.fillStyle = '#e8a020'; g.beginPath(); g.arc(0, -L, R * 0.03, 0, TAU); g.fill(); });
    disc(g, R * 0.07, '#d4e58a', '#8aa63a');
  },
  poppy(g, R, rng, p) {
    ring(g, 4, 0.78, i => petal(g, pRound, R * 0.96, R * 0.5, p.a, p.b, p.c, { vein: false, veins: false, edge: 'rgba(80,0,0,.32)' }));

function makeFlower(species, pal, seed) {

// Sprite library: every flower is painted once, then kept at three sizes so it always draws sharp and fast

(function buildSprites() {
  let seed = 7;

    const c = makeFlower(sp, PAL[sp][i % PAL[sp].length], seed += 13), m = [c];
    let cur = c;
    for (let s = FS / 2; s >= 30; s /= 2) { const d = document.createElement('canvas'); d.width = d.height = s; const g = d.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(cur, 0, 0, s, s); m.push(d); cur = d; }
    const idx = SPRS.length; SPRS.push({ m, sz, sp });

const pickBloom = () => BLOOMS[(Math.random() * BLOOMS.length) | 0];

function drawSpriteOn(g, sc, s, x, y, d, rot, a) {

const drawSprite = (s, x, y, d, rot, a) => drawSpriteOn(ctx, DPR, s, x, y, d, rot, a);

// =============== Other drawing helpers ===============
function heartAt(x, y, size, hue, rot, alpha) {

// =============== Particles (flying flowers, hearts, butterflies, sparkles) - time based ===============
const particles = [];
const HUES = [0, 20, 45, 280, 320, 200, 340, 160];
function addP(type, x, y, power = 1, big = false) {
  if (particles.length > CONFIG.maxParticles) return null;
  const base = { x, y, hue: HUES[(Math.random() * HUES.length) | 0] + rand(-10, 10), rot: rand(0, 6.28), vr: rand(-0.06, 0.06), phase: rand(0, 6.28), life: 0 };
  if (type === 'spark') Object.assign(base, { type, vx: rand(-0.6, 0.6), vy: rand(-0.8, 0.3), size: rand(3, 7), max: rand(25, 45) });
  else if (type === 'butterfly') Object.assign(base, { type, vx: rand(-1, 1), vy: rand(-1.4, -0.4), size: rand(11, 17), max: rand(180, 300) });
  else if (type === 'heart') Object.assign(base, { type, vx: rand(-1.3, 1.3) * power, vy: rand(-2.4, -0.2) * power, size: rand(7, 17) * (big ? 1.5 : 1), max: rand(70, 150) });
  else Object.assign(base, { type: 'flower', spr: pickBloom(), vx: rand(-1.3, 1.3) * power, vy: rand(-2.4, -0.2) * power, size: rand(20, 36) * (big ? 1.3 : 1), max: rand(70, 150) });
  particles.push(base);
  return base;
}
function burstAt(x, y, n) {
  for (let i = 0; i < n; i++) {
    const p = addP(i % 3 === 0 ? 'heart' : 'flower', x, y, 1, true);
    if (!p) return;
    const ang = rand(0, 6.28), sp = rand(2, 7);
    p.vx = Math.cos(ang) * sp; p.vy = Math.sin(ang) * sp - 1; p.max = rand(60, 120);
  }
}
function stepParticles(dt) {
  const k = dt / 16.667;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += k;
    if (p.life > p.max) { particles.splice(i, 1); continue; }
    if (p.type === 'butterfly') { p.phase += 0.35 * k; p.vx += Math.sin(p.life * 0.07 + p.rot) * 0.06 * k; p.vy += (Math.cos(p.life * 0.05) * 0.04 - 0.01) * k; }
    else if (p.type === 'spark') { p.vy += 0.01 * k; }
    else { p.vy += 0.03 * k; p.vx *= Math.pow(0.985, k); }
    p.x += p.vx * k; p.y += p.vy * k; p.rot += p.vr * k;
    const t = p.life / p.max, a = t < 0.1 ? t / 0.1 : t > 0.65 ? Math.max(0, (1 - t) / 0.35) : 1;
    if (p.type === 'flower') drawSprite(SPRS[p.spr], p.x, p.y, p.size * (1 - (p.shrink || 0) * t), p.rot, a);

    else if (p.type === 'spark') sparkAt(p.x, p.y, p.size * (1 - t * 0.5), a);

}

// =============== Sound (soft chime, no files) ===============
let audio = null;
function chime() {
  if (!audio) return;
  const now = audio.currentTime;
  [659.25, 783.99, 987.77, 1318.5].forEach((f, i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, now + i * 0.13);
    g.gain.linearRampToValueAtTime(0.12, now + i * 0.13 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0008, now + i * 0.13 + 1.1);
    o.connect(g).connect(audio.destination); o.start(now + i * 0.13); o.stop(now + i * 0.13 + 1.2);
  });
}

// =============== Hand poses: point / open ===============
// Done in video-pixel space so it does not depend on screen size or mirroring.
function poseOf(raw, zs) {
  const h = raw.map((l, i) => ({ x: l.x * vw, y: l.y * vh, z: (zs ? zs[i] : 0) * vw })), w = h[0];
  const d3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
  // cosine between mcp->pip and pip->tip: ~1 for a straight finger (even when it points at the camera), <0.3 when bent
  const straight = (m, p, t) => { const ax = h[p].x - h[m].x, ay = h[p].y - h[m].y, az = h[p].z - h[m].z, bx = h[t].x - h[p].x, by = h[t].y - h[p].y, bz = h[t].z - h[p].z;
    return (ax * bx + ay * by + az * bz) / (Math.hypot(ax, ay, az) * Math.hypot(bx, by, bz) + 1e-6); };
  const ext = (t, p, m, k) => dist(h[t], w) > dist(h[p], w) * k || (straight(m, p, t) > 0.8 && d3(h[t], w) > d3(h[m], w) * 1.2);
  const cur = (t, p, m, mc) => (dist(h[t], w) < dist(h[mc], w) * 1.15) || straight(m, p, t) < 0.25;
  const curled = [cur(12, 10, 9, 9), cur(16, 14, 13, 13), cur(20, 18, 17, 17)].filter(Boolean).length;
  return {
    point: ext(8, 6, 5, 1.08) && curled >= 2,                                  // index out, others folded
    open: ext(8, 6, 5, 1.15) && ext(12, 10, 9, 1.15) && ext(16, 14, 13, 1.15) && ext(20, 18, 17, 1.15),
  };
}
// Debounce: a pose switches on after ~60 ms and off after ~150 ms, so one noisy tracker frame can't break a trail or a scatter.
function stablePose(h, raw, dt) {
  const st = h.ps || (h.ps = { point: false, open: false, on: { point: 0, open: 0 }, off: { point: 0, open: 0 } });
  for (const k of ['point', 'open']) {
    if (raw[k]) { st.on[k] += dt; st.off[k] = 0; } else { st.off[k] += dt; st.on[k] = 0; }
    if (!st[k] && st.on[k] > 0.06) st[k] = true;
    else if (st[k] && st.off[k] > 0.15) st[k] = false;
  }
  if (st.point && st.open) { if (raw.point && !raw.open) st.open = false; else st.point = false; }
  return { point: st.point, open: st.open };
}

// =============== Heart gesture detection ===============
const handScale = h => Math.max(dist(h[0], h[9]), dist(h[5], h[17]), 8);
function bboxOf(pts) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of pts) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
  return { x: (x0 + x1) / 2, y: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0 };
}
function detectHeart(raw, scr) {
  const hs = raw.map(h => h.map(l => ({ x: l.x * vw, y: l.y * vh })));
  const F = CONFIG.forgiveness;
  let dbg = null;
  for (let i = 0; i < hs.length; i++) for (let j = i + 1; j < hs.length; j++) {     // any two hands (yours, hers, or one person's pair)
    const a = hs[i], b = hs[j];
    if (poseOf(raw[i]).open || poseOf(raw[j]).open) continue;      // flat open hands are never a heart (they only scatter)
    const sc = (handScale(a) + handScale(b)) / 2;
    const idx = dist(a[8], b[8]) / sc, thb = dist(a[4], b[4]) / sc;
    const idxR = dist(a[8], b[8]) / Math.max(dist(a[5], b[5]), 1);
    const thbR = dist(a[4], b[4]) / Math.max(dist(a[2], b[2]), 1);
    const gap = dist(mid(a[8], b[8]), mid(a[4], b[4])) / sc;
    dbg = { idx, thb, idxR, thbR, gap };
    if (idx < 0.85 * F && thb < 0.85 * F && idxR < 0.7 * F && thbR < 0.75 * F && gap > 0.2) {
      const bb = bboxOf([...scr[i], ...scr[j]]);
      const w = clamp(Math.max(bb.w, bb.h * 0.95) * 1.15, 140, Math.min(W, H) * 1.05);
      return { ok: true, dbg, box: { x: bb.x, y: bb.y, w } };
    }

    for (let i = 0; i < hs.length; i++) {

  msg = { start: now, end: now + CONFIG.messageSeconds * 1000 };

  for (let i = 0; i < 40; i++) addP('flower', rand(0, W), H + 10, rand(1.5, 3.2));

  if (pointing) lastPointAt = now;
  const open = poses.map((p, i) => p.open ? i : -1).filter(i => i >= 0);
  if (open.length && !pointing && now - lastPointAt > 350 && !heartActive && now > scatterCool && planted.length >= 5) openHold += dt;
  else openHold = Math.max(0, openHold - dt * 2);
  if (openHold > CONFIG.scatterHoldMs) {
    const from = { x: open.reduce((s, i) => s + pts[i][9].x, 0) / open.length, y: open.reduce((s, i) => s + pts[i][9].y, 0) / open.length };
    scatterAll(now, from); scatterCool = now + 900; openHold = 0;
  }
  if (planted.length > 12 && Math.random() < 0.012) {
    const f = planted[(Math.random() * planted.length) | 0], q = flowerPos(f, anchorXform(now)); addP('butterfly', q.x, q.y);
  }

  // ---- hint pill ----
  let hint = DEFAULT_HINT;
  if (msg) hint = '';
  else if (!handsSeenAt) hint = 'Show your hands';
  else if (hp > 0) hint = 'Hold it...';
  else if (!everTriggered && now - handsSeenAt > 15000 && planted.length > 6) hint = 'Now make a heart with your hands';
  if (hint) say(hint); else statusEl.classList.remove('on');
}

// A garland of flowers grows around the heart from the bottom point up to the top
// while she holds the pose, so she can see it is working.
function drawHeartOutline(b, prog, t) {
  ctx.save(); ctx.translate(b.x, b.y); ctx.scale(b.w, b.w);
  ctx.globalAlpha = 0.18 * prog; ctx.fillStyle = '#ff3d81'; ctx.fill(HEART);
  ctx.globalAlpha = 0.4 * prog; ctx.lineWidth = 2 / b.w; ctx.strokeStyle = '#fff'; ctx.stroke(HEART);
  ctx.restore();
  const M = 48, half = M / 2, shown = Math.floor(half * prog), fs = b.w * 0.17;
  for (let k = 0; k <= shown; k++) {
    for (const sgn of (k === 0 ? [1] : [1, -1])) {
      const p = heartPt(0.5 + sgn * k / M), i = k * 2 + (sgn < 0 ? 1 : 0);
      drawSprite(SPRS[WARM[i % WARM.length]], b.x + p.x * b.w, b.y + p.y * b.w + Math.sin(t / 300 + i) * 1.5,
                 fs * (0.92 + 0.14 * Math.sin(t / 250 + i)), i + t / 2500, 1);
    }
  }
}
function drawBurst(now) {
  if (!burst) return;
  const p = (now - burst.start) / 1000;
  if (p > 1) { burst = null; return; }
  const e = 1 - Math.pow(1 - p, 3);
  glossyHeart(burst.x, burst.y, burst.w * (0.7 + 0.9 * e), (1 - p) * 0.9);
}

// =============== Text drawn on canvas (so photos include it) ===============
let titleImg = null, titleKey = '';
function drawTitle() {
  const fs = Math.min(W * 0.09, 64), h = Math.ceil(fs * 2.4), key = W + 'x' + H + CONFIG.title + CONFIG.subtitle;
  if (key !== titleKey) {
    titleKey = key;
    const c = document.createElement('canvas'); c.width = Math.ceil(W * DPR); c.height = Math.ceil(h * DPR);
    const g = c.getContext('2d'); g.scale(DPR, DPR); g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `${fs}px Pacifico, cursive`; g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 14; g.shadowOffsetY = 2;
    g.fillStyle = '#ffe45e'; g.fillText(CONFIG.title, W / 2, fs * 0.9);
    g.font = `${fs * 0.42}px Pacifico, cursive`; g.fillStyle = 'rgba(255,255,255,.92)';
    g.fillText(CONFIG.subtitle, W / 2, fs * 0.9 + fs * 0.85);
    titleImg = { c, h, top: H * 0.085 - fs * 0.9 };
  }
  ctx.drawImage(titleImg.c, 0, titleImg.top, W, titleImg.h);
}
function drawMessage(now) {
  if (!msg) return;
  if (now > msg.end + 600) { msg = null; return; }
  const fadeIn = Math.min((now - msg.start) / 500, 1), fadeOut = now > msg.end ? 1 - (now - msg.end) / 600 : 1;
  const a = Math.max(0, Math.min(fadeIn, fadeOut)), pop = 0.8 + 0.2 * easeOutBack(fadeIn);
  const lines = CONFIG.heartMessage;
  const shown = Math.floor((now - msg.start - 400) / 28);
  let fs = Math.min(W * 0.065, 36);
  ctx.font = `${fs}px Pacifico, cursive`;
  const cardW = Math.min(W * 0.88, 540);
  while (fs > 9 && Math.max(...lines.map(l => ctx.measureText(l).width)) > cardW - 56) { fs -= 1; ctx.font = `${fs}px Pacifico, cursive`; }
  while (fs > 11 && lines.length * fs * 1.5 + 64 > H * 0.8) { fs -= 1; ctx.font = `${fs}px Pacifico, cursive`; }
  const lh = fs * 1.5, cardH = lines.length * lh + 64;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(pop, pop); ctx.globalAlpha = a;
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 8;
  ctx.fillStyle = 'rgba(255,240,246,.95)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-cardW / 2, -cardH / 2, cardW, cardH, 28); else ctx.rect(-cardW / 2, -cardH / 2, cardW, cardH);
  ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.fillStyle = '#c2185b'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let left = Math.max(0, shown);
  lines.forEach((l, i) => {
    const part = l.slice(0, Math.max(0, Math.min(l.length, left))); left -= l.length;
    ctx.font = `${fs}px Pacifico, cursive`;
    ctx.fillText(part, 0, -cardH / 2 + 32 + lh * (i + 0.5));
  });
  // beating heart above the card
  const hs = 0.07 + Math.sin(now / 200) * 0.004;
  ctx.translate(0, -cardH / 2 - 6); ctx.scale(hs * W, hs * W);
  ctx.fillStyle = '#ff3d81'; ctx.fill(HEART);
  ctx.restore();
}
let drawFps = 0, fpsAcc = 0, fpsN = 0;
function drawDebug() {
  if (!DEBUG) return;
  ctx.save(); ctx.font = '12px monospace'; ctx.textAlign = 'left'; ctx.fillStyle = '#0f0'; ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
  const d = heartDbg, f = v => v == null ? '-' : v.toFixed(2);
  const lines = [`draw ${drawFps.toFixed(0)}fps  tracker ${trFps.toFixed(0)}fps  pass ${passMs.toFixed(0)}ms`,
    `hands ${hands.length}  planted ${planted.length}  head ${head.ok ? 'yes' : 'no'}  roll ${(head.roll * 57.3).toFixed(0)}deg`,
    d ? `heart idx ${f(d.idx)} thb ${f(d.thb)} idxR ${f(d.idxR)} thbR ${f(d.thbR)} gap ${f(d.gap)}` : 'heart: need two hands'];
  htracks.forEach(h => lines.push(`hand#${h.id} ${h.lab} score ${(h.sc || 0).toFixed(2)} point ${h.ps && h.ps.point ? 'Y' : '-'} open ${h.ps && h.ps.open ? 'Y' : '-'}`));
  lines.forEach((l, i) => ctx.fillText(l, 8, H * 0.2 + i * 16));
  ctx.restore();
}

// =============== Render ===============
let lastNow = 0;
function frame(now) {
  const dt = Math.min(now - (lastNow || now), 50); lastNow = now;
  fpsAcc += dt; fpsN++; if (fpsAcc > 1000) { drawFps = fpsN * 1000 / fpsAcc; fpsAcc = fpsN = 0; }
  ctx.clearRect(0, 0, W, H);
  update(now, dt);
  drawGarden(now); drawHands(); drawWands(now);
  stepParticles(dt);
  if (heartBox && hp > 0) drawHeartOutline(heartBox, Math.min(hp / CONFIG.holdMs, 1), now);
  drawBurst(now); drawTitle(); drawMessage(now); drawDebug();
  requestAnimationFrame(frame);
}

// =============== Camera + models ===============
let stream = null;
async function openCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 960 }, height: { ideal: 540 }, frameRate: { ideal: 30, max: 30 } }, audio: false });
  video.srcObject = stream; await video.play(); vw = video.videoWidth; vh = video.videoHeight;
  mirrored = facing === 'user'; video.classList.toggle('back', !mirrored);
}

async function start() {
  const st = document.getElementById('start'); st.classList.add('hide'); setTimeout(() => st.style.display = 'none', 600);
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  say('Starting camera...');
  try { await document.fonts.load('32px Pacifico'); } catch (e) {}
  try { await openCamera(); }
  catch (e) { say('Camera blocked. Allow camera access and reload (needs https).'); return; }

  const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/';
  let tracker = null, fd = null;
  try {
    tracker = new Hands({ locateFile: f => base + 'hands@0.4.1675469240/' + f });
    tracker.setOptions({ maxNumHands: CONFIG.maxHands, modelComplexity: CONFIG.handModel, minDetectionConfidence: 0.55, minTrackingConfidence: 0.5 });
    tracker.onResults(r => { ingestHands(r.multiHandLandmarks || [], performance.now(), r.multiHandedness); trFrames++; });
    fd = new FaceDetection({ locateFile: f => base + 'face_detection@0.4.1646425229/' + f });
    fd.setOptions({ model: 'short', minDetectionConfidence: 0.5 });
    fd.onResults(r => ingestFace(r.detections && r.detections[0], performance.now()));
  } catch (e) { say('Could not load tracking. Check your internet and reload.'); tracker = null; }

  document.getElementById('flip').classList.add('show');
  document.getElementById('shot').classList.add('show');
  if (tracker) say('Loading tracking...');
  requestAnimationFrame(frame);
  // wait for a genuinely new camera frame (saves battery, avoids processing duplicates)
  const nextFrame = () => new Promise(res => {
    const t = setTimeout(res, 150);
    const done = () => { clearTimeout(t); res(); };
    if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(done); else requestAnimationFrame(done);
  });
  let n = 0, t0 = performance.now(), f0 = 0, slowN = 0, modelNow = CONFIG.handModel;
  while (true) {
    await nextFrame();
    const ts = performance.now();
    if (video.readyState >= 2 && tracker) {
      try {
        await tracker.send({ image: video });
        const every = passMs < 22 ? 1 : passMs < 36 ? 2 : 3;      // face is cheap, but skip it more often on a slower phone
        if (n++ % every === 0) await fd.send({ image: video });
      } catch (e) {}
    }
    const took = performance.now() - ts; passMs += (took - passMs) * 0.2;
    // the accurate hand model is heavier: if this device can't keep up, quietly switch to the fast one
    if (tracker && modelNow === 1 && ++slowN > 25 && passMs > 55) { modelNow = 0; try { tracker.setOptions({ modelComplexity: 0 }); } catch (e) {} }
    else if (passMs <= 55) slowN = Math.max(0, slowN - 1);
    // adaptive pacing: leave the main thread at least ~half free so drawing never stutters
    await new Promise(r => setTimeout(r, Math.max(4, clamp(passMs * 1.3, 18, 70) - took * 0)));
    const t = performance.now();
    if (t - t0 > 2000) { trFps = (trFrames - f0) * 1000 / (t - t0); f0 = trFrames; t0 = t; }
  }
}

// =============== Buttons ===============
document.getElementById('go').addEventListener('click', start);
document.getElementById('flip').addEventListener('click', async () => {
  facing = facing === 'user' ? 'environment' : 'user'; htracks = []; hands = []; faceTrack.init = false; head.ok = head.has = false; clearGarden();
  try { await openCamera(); } catch (e) { facing = facing === 'user' ? 'environment' : 'user'; try { await openCamera(); } catch (e2) {} }
});
document.getElementById('replay').addEventListener('click', () => trigger(performance.now(), true));
function snapshot() {
  const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height;
  const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sc = coverScale(), dw = vw * sc, dh = vh * sc;
  g.save(); if (mirrored) { g.translate(W, 0); g.scale(-1, 1); }
  g.drawImage(video, (W - dw) / 2, (H - dh) / 2, dw, dh); g.restore();
  if (vignette) g.drawImage(vignette, 0, 0, W, H);
  g.drawImage(canvas, 0, 0, W, H);
  return c;
}
document.getElementById('shot').addEventListener('click', () => {
  const f = document.getElementById('flash'); f.style.opacity = .8; setTimeout(() => f.style.opacity = 0, 120);
  snapshot().toBlob(async blob => {
    if (!blob) return;
    const file = new File([blob], 'our-moment.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch (e) {} }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'our-moment.png'; a.click();
  }, 'image/png');
});
// double-tap anywhere shows the message (handy for testing)
let lastTap = 0;
addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  const t = performance.now(); if (t - lastTap < 350) trigger(t, true); lastTap = t;
});
</script>
